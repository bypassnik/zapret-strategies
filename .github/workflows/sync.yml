name: Sync strategies from Flowseal

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Принудительный тег upstream (пусто = latest)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Resolve upstream tag
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(gh api repos/Flowseal/zapret-discord-youtube/releases/latest --jq .tag_name)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Skip if already synced
        id: check
        run: |
          if [ -f "strategies/${{ steps.upstream.outputs.tag }}.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Версия ${{ steps.upstream.outputs.tag }} уже обработана"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse strategies and build bundle
        if: steps.check.outputs.skip == 'false'
        run: |
          npm test
          npm run parse -- --tag "${{ steps.upstream.outputs.tag }}"

      - name: Commit and push
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "strategies/${{ steps.upstream.outputs.tag }}.json" strategies/index.json "bundles/${{ steps.upstream.outputs.tag }}.zip"
          git diff --staged --quiet && exit 0
          git commit -m "chore: sync strategies and bundle for Flowseal ${{ steps.upstream.outputs.tag }}"
          git push
